[project]
name = "resume-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aakashgupta41", email = "aakashguptamdeen41@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "pypdf>=7.0.0",
]

[project.scripts]
resume-chatbot = "resume_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
